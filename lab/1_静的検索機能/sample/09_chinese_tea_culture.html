        <h1>中国六大茶类的基本分类与冲泡要点</h1>
        <p>中国茶叶种类繁多，按照加工工艺和发酵程度的不同，通常划分为六大基本茶类：绿茶、白茶、黄茶、青茶（乌龙茶）、红茶和黑茶。</p>
        <p><strong>绿茶</strong>属于不发酵茶，保留了鲜叶的天然物质，冲泡时水温不宜过高，一般以80℃至85℃为宜，以免烫熟茶叶产生苦涩味。而<strong>乌龙茶</strong>属于半发酵茶，兼具绿茶的清香与红茶的醇厚，适合使用沸水高冲，以激发其独特的兰花香或岩韵。</p>
