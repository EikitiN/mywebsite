    <article class="topic" id="what-is-UESDR">
        <h2 class="topic-title">エ連邦とは？</h2>
        <p>エ連邦とは、このサイトの運営者が<a href="https://ja.wikipedia.org/wiki/%E4%B8%AD%E4%BA%8C%E7%97%85">中学生の頃に部活でのノリでできた架空国家</a>です。
            それから年月も過ぎ、当時のような細かい設定などを維持するのはめんどくなったので、
            無理なく、楽しい範囲でその設定を引き継ぎつつ、ペンネームとして活動に使うなんかです。
            まあまあな期間この名前で活動をしてきたので、この名前は引き継いだ、という感じです。
        </p>
    </article>

    <script>
        let Jsondata;
        async function getJsonData() {
            try {
                const response = await fetch('https://eikitin.github.io/mywebsite/file-list.json');
                
                // レスポンスが正常か確認する
                if (!response.ok) {
                throw new Error(`HTTPエラー! ステータス: ${response.status}`);
                }

                Jsondata = await response.json();
            } catch (error) {
                console.error('データの取得に失敗しました:', error);
            }
        }

        await getJsonData();
        console.log(Jsondata);

    </script>
