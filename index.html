<!DOCTYPE html>
<html>
<head>
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-5H5H7H3T"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/mywebsite/root-files/favicon.png">
    <link rel="stylesheet" href="/mywebsite/css/style.css">
    <link rel="stylesheet" href="css/substyle.css">
    <link rel="apple-touch-icon" href="/mywebsite/root-files/favicon.png">

    <meta property="og:prefix" content="og: https://ogp.me/ns#">
    <meta property="og:title" content="えいきちのウェブサイト">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://eikitin.github.io/mywebsite/">
    <meta property="og:image" content="https://eikitin.github.io/mywebsite/root-files/placeholder-image.png">
    <meta property="og:description" content="えいきちのウェブサイト ホームページ、ルートページ">
    <meta property="og:site_name" content="えいきちのウェブサイト">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@ussdr_uesdr">

    <title>えいきちのウェブサイト</title>
    <script type="application/json" id="page-meta">
        {
            "summary": "トップページ・サイト全体のトップページです",
            "category": "トップページ",
            "tags": ["index", "mainpage", "toppage"]
            "created": "2026/11/8"
        }
    </script>
</head>
<body>
    <h1 class="center title">えいきちのウェブサイトへ<wbr>ようこそ</h1>
    <p>以前はfc2で公開していましたが、管理がめんどくさかった、スタイルがダサかったため一から作り直しています。
        プログラミング(HTML/JavaScript)の練習もかねて
    </p>
    <article class="topic" id="latest">
        <h2 class="topic-title">新規更新ページ</h2>
        <p class="disp-none center" id="latest-status">読み込み中</p>
        <script>const p=document.getElementById("latest-status");p.classList.remove("disp-none");</script>
        <noscript><p>読み込めませんでした: JavaScriptが無効です</p></noscript>
    </article>

    <div id="footer-container"></div>

    <script src="/mywebsite/JavaScript/AllPages.js"></script>
    <script>
        (async () => {
            const container = document.getElementById("latest");
            try {
                const response = await fetch('https://eikitin.github.io/mywebsite/file-list.json');
                
                // レスポンスが正常か確認する
                if (!response.ok) {
                throw new Error(`HTTPエラー! ステータス: ${response.status}`);
                }

                //表示処理
                const Jsondata = await response.json();
                Jsondata.sort((a, b) => b.updatedAt - a.updatedAt);
                
                const HtmlParts = [`<h2 class="topic-title">新規更新ページ</h2>`];
                for (let x = 0; x < 5; x++) {
                    const path = `https://eikitin.github.io/mywebsite/${Jsondata[x]["path"]}`;
                    const date = new Date(Jsondata[x]["updatedAt"]);
                    const updateddate = date.toLocaleDateString('ja-JP');

                    const response = await fetch(path);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const htmlText = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');
                    const title = doc.querySelector('title')?.textContent || "タイトルなし";
                    const scriptTag = doc.querySelector('script#page-meta');
                    let metaData = {};
                    if (scriptTag) {
                        try {
                            metaData = JSON.parse(scriptTag.textContent);
                        } catch (e) {
                            console.error("JSONのパースに失敗しました", e);
                        }
                    }

                    const addition = `
                    <a href="${path}" class="a-nodesign"><div class="latest-content">
                        <div class="latest-content-date">${updateddate}</div>
                        <div class="latest-content-content">
                            <div>${title}</div>
                            <div>${metaData["summary"]}</div>
                            <div class="category">カテゴリー: ${metaData["category"]}</div>
                        </div>
                    </div></a>
                    `;
                    HtmlParts.push(addition);
                }
                container.innerHTML = HtmlParts.join('');
            } catch (error) {
                console.error('データの取得に失敗しました:', error);
            }
        })();

    </script>
</body>
</html>
