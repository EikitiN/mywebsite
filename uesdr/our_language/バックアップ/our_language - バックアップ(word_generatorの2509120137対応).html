		<b>これは「辞書」です。基本形で検索しないと出て来ません。<br>一単語ずつ検索してください。翻訳機じゃないです。</b>

<script>
// 既存の変換スクリプト（characterDataの宣言を削除）
const jsonFilePath = 'character.json';
// let characterData = []; ← この行を削除

// JSON読み込み
fetch(jsonFilePath)
  .then(response => {
    if (!response.ok) throw new Error(`HTTPエラー: ${response.status}`);
    return response.json();
  })
  .then(data => {
    // グローバル変数に代入（宣言はしない）
    window.characterData = data;
    initInputHandlers();
  })
  .catch(error => {
    console.error('JSON読み込み失敗:', error);
    window.characterData = [];
    initInputHandlers();
  });

function initInputHandlers() {
  const inputs = {
    hyouki: document.getElementById('inputhyouki'),
    kari: document.getElementById('inputkari'),
    data: document.getElementById('inputdata')
  };

  // 入力イベントリスナー登録
  Object.keys(inputs).forEach(key => {
    inputs[key].addEventListener('input', (e) => {
      processFullTextSync(key);
    });
  });

  // 文字列全体を解析して同期
  function processFullTextSync(activeKey) {
    const activeText = inputs[activeKey].value;
    let results = {
      hyouki: activeKey === 'hyouki' ? activeText : '',
      kari: activeKey === 'kari' ? activeText : '',
      data: activeKey === 'data' ? activeText : ''
    };

    // 変換マッピング設定
    const conversionRules = {
      hyouki: {
        searchKey: 'character',
        kari: (found) => found ? found.sub : '',
        data: (found) => found ? found.data : ''
      },
      kari: {
        searchKey: (char) => {
          const foundSub = window.characterData.find(item => item.sub === char);
          if (foundSub) return { key: 'sub', found: foundSub };
          
          const foundSubBig = window.characterData.find(item => item.sub_big === char);
          if (foundSubBig) return { key: 'sub_big', found: foundSubBig };
          
          return null;
        },
        hyouki: (found) => found ? found.character : '',
        data: (found) => found ? found.data : ''
      },
      data: {
        searchKey: 'data',
        hyouki: (found) => found ? found.character : '',
        kari: (found) => found ? found.sub : ''
      }
    };

    // 1文字ずつ処理
    for (let i = 0; i < activeText.length; i++) {
      const char = activeText[i];
      const rule = conversionRules[activeKey];
      
      // 特殊処理: inputkariの検索
      let found;
      if (activeKey === 'kari') {
        const searchResult = rule.searchKey(char);
        found = searchResult ? searchResult.found : null;
      } else {
        found = window.characterData.find(item => item[rule.searchKey] === char);
      }

      // 他の欄に変換結果を追加
      Object.keys(results).forEach(targetKey => {
        if (targetKey !== activeKey && rule[targetKey]) {
          results[targetKey] += rule[targetKey](found) || char;
        }
      });
    }

    // 結果を反映（変更がある場合のみ）
    Object.keys(inputs).forEach(key => {
      if (inputs[key].value !== results[key]) {
        inputs[key].value = results[key];
      }
    });
  }
}
</script>
